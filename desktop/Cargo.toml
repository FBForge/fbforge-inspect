[package]
name = "fbforge-inspect"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "EUPL-1.2"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["process", "io-util", "sync", "time", "macros"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
