[workspace]
members = ["crates/suite-core", "crates/suite-coordination", "crates/suite-nsis-guard"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.1"
license = "EUPL-1.2"
edition = "2021"
rust-version = "1.93"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
semver = { version = "=1.0.28", features = ["serde"] }
ring = "=0.17.14"
