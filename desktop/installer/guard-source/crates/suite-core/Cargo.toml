windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_Globalization", "Win32_System_RestartManager", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Security_WinTrust", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_System_LibraryLoader", "Win32_System_WindowsProgramming", "Win32_Networking_WinHttp", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
