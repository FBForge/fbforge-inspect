name: Publish verified Windows release
on:
  workflow_dispatch:
    inputs:
      signing_run:
        description: Successful Sign Windows candidate run for the existing version tag
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-windows-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository_id == '1437423043' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Publish only the independently verified signed package
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_RUN: ${{ inputs.signing_run }}
          EXPECTED_SIGNER: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        run: python3 scripts/ci/publish-release.py
