name: Verify 0.2.0 candidate
on:
  push:
    branches: [main, release/0.2.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: engine/pom.xml
      - name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy && rustup default 1.96.0
      - run: npm ci
      - run: npm run typecheck && npm run build:frontend && npm run quality:java
      - name: Portable Java CLI on Linux
        run: python3 scripts/ci/cli-smoke.py engine/target/inspect-engine-0.2.0.jar
      - name: PowerShell for Windows packaging regression tests
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()
      - run: node --test --test-isolation=none tests/*.test.mjs
      - run: npm run format:check
      - run: npm run docs:build
      - run: cargo fetch --locked --manifest-path desktop/Cargo.toml
      - run: cargo test --locked --manifest-path desktop/native-contracts/Cargo.toml
      - run: npm run licenses:collect && npm run stage:engine
      - run: cargo fmt --manifest-path desktop/Cargo.toml --check
      - run: cargo test --locked --manifest-path desktop/Cargo.toml -j 4
      - run: cargo clippy --locked --manifest-path desktop/Cargo.toml --all-targets -j 4 -- -D warnings
      - run: npx playwright install --with-deps chromium
      - run: npm run quality:duplicates
      - run: npm run quality:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-evidence
          path: |
            engine/target/surefire-reports/
            engine/target/site/jacoco/
            .local/quality/
            test-results/
          if-no-files-found: warn
          include-hidden-files: true
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: engine/pom.xml
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.96.0
      - name: Install pinned x86 installer guard toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --target i686-pc-windows-msvc
      - run: npm ci
      # The isolated NSIS builder performs typecheck and builds the frontend below.
      - run: npm run build:engine
      - name: Signing contracts and package integrity without a token
        run: node --test --test-isolation=none tests/signing-gate.test.mjs tests/signing.test.mjs tests/signed-package.test.mjs
      - run: cargo fetch --locked --manifest-path desktop/Cargo.toml
      - name: Check localized labels with Windows PowerShell
        run: node --test --test-isolation=none tests/windows-encoding.test.mjs
      - run: npm run licenses:collect
      - run: npm run stage:engine
      - run: cargo test --locked --manifest-path desktop/Cargo.toml
      - name: Build unsigned NSIS candidate
        id: package
        shell: powershell
        run: ./scripts/build-windows.ps1 -InspectJavaHome $env:JAVA_HOME
      - name: Real WebView2 and bundled Java round trip
        env:
          INSPECT_LIVE_READONLY: '1'
        run: node tests/native-windows.mjs .local/artifacts/windows-x64/fbforge-inspect.exe .local/native-evidence
      - name: Portable CLI with the packaged Windows runtime
        run: python scripts/ci/cli-smoke.py .local/artifacts/windows-x64/engine/inspect-engine.jar --java .local/artifacts/windows-x64/engine/runtime/bin/java.exe
      - name: Reject unsigned installer before target mutation
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: powershell
        run: |
          $setup = @(Get-ChildItem .local/artifacts/windows-x64 -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw 'expected_one_installer' }
          ./scripts/ci/test-unsigned-installer.ps1 -ToolId fbforge-inspect -InstallerPath $setup[0].FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-unsigned-candidate
          path: |
            .local/artifacts/windows-x64/
            .local/native-evidence/
          if-no-files-found: warn
          include-hidden-files: true
